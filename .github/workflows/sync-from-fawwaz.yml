name: 🔄 Sync → Nobody-Just-Me & efrisa-team

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Nobody-Just-Me and efrisa-team
        run: |
          git clone --mirror https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git repo.git
          cd repo.git
          REPO_NAME=$(basename ${{ github.repository }})
          git push --mirror https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/Nobody-Just-Me/${REPO_NAME}.git || true
          git push --mirror https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/EFRISA-TEAM/${REPO_NAME}.git || true
